<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A S K Homes - Admin Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f4f4f9; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .hidden { display: none; }
        input, button, select { padding: 10px; margin: 5px 0; width: 100%; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;}
        button { background: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #0056b3; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .form-section { background: #e9ecef; padding: 15px; border-radius: 5px; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h2>A S K Homes - Management</h2>

    <!-- Login Section -->
    <div id="login-section">
        <h3>Admin Login</h3>
        <input type="email" id="email" placeholder="Admin Email">
        <input type="password" id="password" placeholder="Password">
        <button id="login-btn">Login</button>
    </div>

    <!-- Dashboard Section -->
    <div id="dashboard-section" class="hidden">
        <h3>Welcome Admin <button id="logout-btn" style="width:auto; float:right; background:red;">Logout</button></h3>
        
        <!-- Add New Resident Form -->
        <div class="form-section">
            <h4>Add New Resident</h4>
            <input type="text" id="new-name" placeholder="Resident Name" required>
            <input type="tel" id="new-phone" placeholder="Phone Number" required>
            <input type="text" id="new-room" placeholder="Room Number (eg: 101)" required>
            <select id="new-food">
                <option value="with_food">With Food</option>
                <option value="without_food">Without Food</option>
            </select>
            <button id="add-resident-btn" style="background: #28a745;">Add Resident</button>
        </div>

        <!-- Residents Table -->
        <h4 style="margin-top: 30px;">Resident Details</h4>
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Phone</th>
                    <th>Room</th>
                    <th>Food</th>
                </tr>
            </thead>
            <tbody id="resident-list">
                <!-- Firebase data will load here -->
            </tbody>
        </table>
    </div>
</div>

<!-- Firebase SDK -->
<script type="module">
    // NOTICE: 'addDoc' is added to the imports
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js";
    import { getFirestore, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

    // REPLACE THIS WITH YOUR FIREBASE CONFIG
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT.firebaseapp.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT.appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const loginSection = document.getElementById('login-section');
    const dashboardSection = document.getElementById('dashboard-section');
    const residentList = document.getElementById('resident-list');

    // Authentication State Listener
    onAuthStateChanged(auth, (user) => {
        if (user) {
            loginSection.classList.add('hidden');
            dashboardSection.classList.remove('hidden');
            fetchResidents();
        } else {
            loginSection.classList.remove('hidden');
            dashboardSection.classList.add('hidden');
        }
    });

    // Login & Logout
    document.getElementById('login-btn').addEventListener('click', () => {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        signInWithEmailAndPassword(auth, email, password)
            .catch(error => alert("Login Failed: " + error.message));
    });

    document.getElementById('logout-btn').addEventListener('click', () => {
        signOut(auth);
    });

    // Add New Resident Logic
    document.getElementById('add-resident-btn').addEventListener('click', async () => {
        const name = document.getElementById('new-name').value;
        const phone = document.getElementById('new-phone').value;
        const room = document.getElementById('new-room').value;
        const food = document.getElementById('new-food').value;

        if(!name || !phone || !room) {
            alert("Please fill all fields!");
            return;
        }

        try {
            // Adding data to 'residents' collection
            await addDoc(collection(db, "residents"), {
                name: name,
                phone: phone,
                room_id: room,
                food_preference: food,
                check_in_date: new Date().toISOString().split('T')[0] // automatically saves current date
            });
            
            alert("Resident added successfully!");
            
            // Clear input fields
            document.getElementById('new-name').value = '';
            document.getElementById('new-phone').value = '';
            document.getElementById('new-room').value = '';
            
            // Refresh table
            fetchResidents();
        } catch (error) {
            console.error("Error adding resident: ", error);
            alert("Failed to add resident.");
        }
    });

    // Fetch Data Logic
    async function fetchResidents() {
        residentList.innerHTML = "<tr><td colspan='4'>Loading data...</td></tr>";
        try {
            const querySnapshot = await getDocs(collection(db, "residents"));
            residentList.innerHTML = ""; 
            
            querySnapshot.forEach((doc) => {
                const data = doc.data();
                const row = `<tr>
                    <td>${data.name}</td>
                    <td>${data.phone}</td>
                    <td>${data.room_id}</td>
                    <td>${data.food_preference === 'with_food' ? 'Yes' : 'No'}</td>
                </tr>`;
                residentList.innerHTML += row;
            });
        } catch (error) {
            console.error("Error fetching data: ", error);
        }
    }
</script>

</body>
</html>
