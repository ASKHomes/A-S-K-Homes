<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A S K Homes | Login</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #121212;
            --form-bg: #1a1a1a;
            --text-main: #ffffff;
            --text-muted: #888888;
            --input-bg: #222222;
            --border-color: #333333;
            --gradient-btn: linear-gradient(90deg, #ff7033 0%, #b53cff 100%);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hidden { display: none !important; }

        /* ================= LOGIN SCREEN (DARK UI) ================= */
        #login-screen {
            display: flex;
            width: 100%;
            min-height: 100vh;
        }

        .login-left {
            flex: 1;
            padding: 40px 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            max-width: 500px;
            margin: 0 auto;
        }

        .login-right {
            flex: 1;
            /* Placeholder for the hand/phone image */
            background: radial-gradient(circle at center, #3a1525 0%, #0a0a0a 70%), url('https://images.unsplash.com/photo-1616077168712-fc6c788db4af?auto=format&fit=crop&q=80') center/cover;
            background-blend-mode: overlay;
            display: none; /* Hidden on mobile */
        }

        @media (min-width: 900px) {
            .login-right { display: block; }
        }

        .login-left h1 {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .login-left p.subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 40px;
        }

        .social-login {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }

        .btn-social {
            flex: 1;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            transition: 0.3s;
        }

        .btn-social:hover {
            background: var(--input-bg);
        }

        .btn-social img {
            width: 18px;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: var(--text-muted);
            font-size: 12px;
            margin-bottom: 30px;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border-color);
        }

        .divider::before { margin-right: 15px; }
        .divider::after { margin-left: 15px; }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group input {
            width: 100%;
            padding: 15px 20px;
            background: var(--input-bg);
            border: 1px solid transparent;
            border-radius: 8px;
            color: var(--text-main);
            font-family: inherit;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: #ff7033;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            margin-bottom: 30px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
        }

        .forgot-password {
            color: var(--text-muted);
            text-decoration: none;
        }

        .btn-primary {
            width: 100%;
            background: var(--gradient-btn);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            font-family: inherit;
            margin-bottom: 25px;
        }

        .register-link {
            text-align: center;
            font-size: 14px;
            color: var(--text-muted);
        }

        .register-link a {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 500;
        }

        .footer-links {
            position: absolute;
            bottom: 30px;
            left: 80px;
            right: 80px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-muted);
        }

        /* ================= DASHBOARD UI (Basic Light Theme for Admin) ================= */
        #dashboard-screen {
            width: 100%;
            max-width: 900px;
            margin: 40px auto;
            background: white;
            color: #333;
            border-radius: 12px;
            padding: 30px;
            box-sizing: border-box;
        }

        .dash-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid #eee; padding-bottom: 20px;}
        .btn-logout { background: #dc3545; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; }
        .form-card { background: #f8f9fc; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        .form-card input, .form-card select { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        .btn-success { background: #28a745; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; width: 100%;}
        table { width: 100%; border-collapse: collapse; margin-top: 20px;}
        th, td { padding: 12px; border-bottom: 1px solid #ddd; text-align: left; }
        th { background: #f1f1f1; }
    </style>
</head>
<body>

    <!-- ================= 1. LOGIN SCREEN ================= -->
    <div id="login-screen">
        <div class="login-left">
            <h1>Login to Your Account</h1>
            <p class="subtitle">A S K Homes Management</p>

            <div class="social-login">
                <button class="btn-social" type="button">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="Google">
                    Login With Google
                </button>
                <button class="btn-social" type="button">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/f/fa/Apple_logo_black.svg" style="filter: invert(1);" alt="Apple">
                    Login With Apple
                </button>
            </div>

            <div class="divider">OR</div>

            <div class="input-group">
                <input type="email" id="login-email" placeholder="User Name or Email">
            </div>

            <div class="input-group">
                <input type="password" id="login-password" placeholder="Password">
            </div>

            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox"> Remember Me
                </label>
                <a href="#" class="forgot-password">Forgot Password?</a>
            </div>

            <button id="login-btn" class="btn-primary">Login to Your Account</button>

            <div class="register-link">
                Not a member yet? <a href="#">Register Now</a>
            </div>

            <div class="footer-links">
                <span>Privacy Policy</span>
                <span>Copyright 2026</span>
            </div>
        </div>
        <div class="login-right">
            <!-- Background handled in CSS -->
        </div>
    </div>

    <!-- ================= 2. ADMIN DASHBOARD SCREEN ================= -->
    <div id="dashboard-screen" class="hidden">
        <div class="dash-header">
            <h2>A S K Homes - Admin Panel</h2>
            <button id="logout-btn" class="btn-logout">Logout</button>
        </div>

        <div class="form-card">
            <h3>Add New Resident</h3>
            <input type="text" id="new-name" placeholder="Full Name" required>
            <input type="tel" id="new-phone" placeholder="Phone Number" required>
            <input type="text" id="new-room" placeholder="Room No. (e.g. 101)" required>
            <select id="new-food">
                <option value="with_food">With Food</option>
                <option value="without_food">Without Food</option>
            </select>
            <button id="add-resident-btn" class="btn-success">Save Resident</button>
        </div>

        <div>
            <h3>Current Residents</h3>
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Phone</th>
                        <th>Room</th>
                        <th>Food</th>
                    </tr>
                </thead>
                <tbody id="resident-list">
                    <!-- Firebase data loads here -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- ================= FIREBASE LOGIC ================= -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js";
        import { getFirestore, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

        // REPLACE THESE WITH YOUR ACTUAL FIREBASE CONFIG
        const firebaseConfig = {
  apiKey: "AIzaSyBn4P_1jSCub1l4JInHNzi0Bgbz5EBCias",
  authDomain: "askhomes-bd1cf.firebaseapp.com",
  projectId: "askhomes-bd1cf",
  storageBucket: "askhomes-bd1cf.firebasestorage.app",
  messagingSenderId: "306285448800",
  appId: "1:306285448800:web:2d6dd11679442ec8787d05",
  measurementId: "G-N1E0BQ9RR1"
};

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const loginScreen = document.getElementById('login-screen');
        const dashboardScreen = document.getElementById('dashboard-screen');
        const residentList = document.getElementById('resident-list');

        // Auth State
        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginScreen.classList.add('hidden');
                document.body.style.backgroundColor = "#f4f4f9"; // Light bg for dashboard
                dashboardScreen.classList.remove('hidden');
                fetchResidents(); 
            } else {
                document.body.style.backgroundColor = "#121212"; // Dark bg for login
                dashboardScreen.classList.add('hidden');
                loginScreen.classList.remove('hidden');
            }
        });

        // Login
        document.getElementById('login-btn').addEventListener('click', () => {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            if(!email || !password) return alert("Enter email and password!");
            
            signInWithEmailAndPassword(auth, email, password)
                .catch(error => alert("Login Failed: " + error.message));
        });

        // Logout
        document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));

        // Add Resident
        document.getElementById('add-resident-btn').addEventListener('click', async () => {
            const name = document.getElementById('new-name').value;
            const phone = document.getElementById('new-phone').value;
            const room = document.getElementById('new-room').value;
            const food = document.getElementById('new-food').value;

            if(!name || !phone || !room) return alert("Please fill all fields!");
            document.getElementById('add-resident-btn').innerText = "Saving...";

            try {
                await addDoc(collection(db, "residents"), {
                    name: name,
                    phone: phone,
                    room_id: room,
                    food_preference: food,
                    check_in_date: new Date().toISOString().split('T')[0]
                });
                alert("Resident Added!");
                
                document.getElementById('new-name').value = '';
                document.getElementById('new-phone').value = '';
                document.getElementById('new-room').value = '';
                document.getElementById('add-resident-btn').innerText = "Save Resident";
                
                fetchResidents();
            } catch (error) {
                console.error(error);
                alert("Error saving resident.");
                document.getElementById('add-resident-btn').innerText = "Save Resident";
            }
        });

        // Fetch Residents
        async function fetchResidents() {
            residentList.innerHTML = "<tr><td colspan='4'>Loading data...</td></tr>";
            try {
                const querySnapshot = await getDocs(collection(db, "residents"));
                residentList.innerHTML = ""; 
                
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const isFood = data.food_preference === 'with_food' ? 'Yes' : 'No';
                    const row = `<tr>
                        <td><strong>${data.name}</strong></td>
                        <td>${data.phone}</td>
                        <td>${data.room_id}</td>
                        <td>${isFood}</td>
                    </tr>`;
                    residentList.innerHTML += row;
                });
            } catch (error) {
                console.error("Error fetching data: ", error);
                residentList.innerHTML = "<tr><td colspan='4'>Failed to load data.</td></tr>";
            }
        }
    </script>
</body>
</html>
